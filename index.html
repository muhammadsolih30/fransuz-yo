  <meta name="theme-color" content="#e83848" />
  <link rel="icon" type="image/png" href="/image/saytlogotef.png" />
  <title>France TCF — Fransuz tili orqali Kanadaga</title>
  <script>
    try {
      var theme = localStorage.getItem("france_tcf_theme");
      var locale = localStorage.getItem("france_tcf_locale") || "uz";
      var dark =
        theme === "dark" ||
        (theme !== "light" &&
          theme === "auto" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      document.documentElement.lang = locale;
    } catch (e) {}
  </script>
</head>
